name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        # Trusted Publishing (OIDC) needs npm 11.5+. Pin to 11.x rather than
        # @latest: npm@latest is now 12.x which requires Node 22+ (EBADENGINE on
        # Node 20), and bleeding-edge npm has broken provenance (missing
        # sigstore). 11.x is stable, Node-20-compatible, and has trusted publishing.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm
        # Trusted Publishing via OIDC — no NPM_TOKEN secret. Requires a Trusted
        # Publisher configured for @humanagencyp/deploy-mcp on npmjs.com
        # pointing at this repo + workflow file (.github/workflows/publish.yml).
        run: npm publish --access public --provenance
